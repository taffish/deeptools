[package]
name = "deeptools"
kind = "tool"
version = "4.0.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/deeptools"

[command]
name = "taf-deeptools"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/deeptools:4.0.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["ngs", "coverage", "bigwig", "visualization", "quality-control", "epigenomics"]
keywords = ["deepTools", "deeptools", "bamCoverage", "bamCompare", "bigWig", "computeMatrix", "plotHeatmap", "plotProfile", "ChIP-seq", "RNA-seq"]
description = "deepTools 4.0.0 command suite for BAM/bigWig processing, quality control, matrix generation, and sequencing-data visualization."

[upstream]
name = "deepTools"
type = "github"
repo = "deeptools/deepTools"
homepage = "https://deeptools.readthedocs.io/"
release_url = "https://github.com/deeptools/deepTools/releases/tag/4.0.0"
downloads = "https://pypi.org/project/deepTools/4.0.0/; https://github.com/deeptools/deepTools/archive/refs/tags/4.0.0.tar.gz"
version = "4.0.0"
license = "MIT"
citation = "Ramirez et al. 2016, deepTools2: a next generation web server for deep-sequencing data analysis"
doi = "10.1093/nar/gkw257"
pmid = "27079975"
watch = "tags"

[smoke]
backend = "docker"
timeout = 300
exist = ["deeptools", "bamCoverage", "bamCompare", "bigwigAverage", "bigwigCompare", "multiBamSummary", "multiBigwigSummary", "computeMatrix", "computeMatrixOperations", "plotHeatmap", "plotProfile", "plotCorrelation", "plotPCA", "plotCoverage", "plotFingerprint", "plotEnrichment", "bamPEFragmentSize", "computeGCBias", "correctGCBias", "alignmentSieve", "estimateReadFiltering", "estimateScaleFactor", "bamCoverage_old", "bamCompare_old", "computeMatrix_old", "alignmentSieve_old", "multiBamSummary_old", "deeptools-resources", "deeptools-smoke", "python", "python3", "bash", "sh", "curl"]
test = ["deeptools-smoke identity", "deeptools-smoke help", "deeptools-smoke core", "deeptools-smoke legacy", "deeptools-smoke plots", "deeptools-smoke gc", "deeptools-smoke resources"]
