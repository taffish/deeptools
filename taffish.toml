[package]
name = "deeptools"
kind = "tool"
version = "3.5.6"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/deeptools"

[meta]
domain = "bio"
categories = ["ngs", "coverage", "bigwig", "visualization", "quality-control", "epigenomics"]
keywords = ["deepTools", "deeptools", "bamCoverage", "bamCompare", "bigWig", "computeMatrix", "plotHeatmap", "plotProfile", "ChIP-seq", "RNA-seq"]
description = "deepTools 3.5.6 command suite for BAM/bigWig processing, quality control, matrix generation, and sequencing-data visualization."

[command]
name = "taf-deeptools"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/deeptools:3.5.6-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[upstream]
name = "deepTools"
type = "github"
repo = "deeptools/deepTools"
homepage = "https://deeptools.readthedocs.io/"
release_url = "https://github.com/deeptools/deepTools/releases/tag/3.5.6"
downloads = "https://pypi.org/project/deepTools/3.5.6/; https://github.com/deeptools/deepTools/archive/refs/tags/3.5.6.tar.gz"
version = "3.5.6"
license = "MIT; deeptools/cm.py is BSD-licensed"
citation = "Ramirez et al. 2016, deepTools2: a next generation web server for deep-sequencing data analysis"
doi = "10.1093/nar/gkw257"
pmid = "27079975"
watch = "tags"

[smoke]
backend = "docker"
timeout = 300
exist = ["deeptools", "bamCoverage", "bamCompare", "bigwigAverage", "bigwigCompare", "multiBamSummary", "multiBigwigSummary", "computeMatrix", "computeMatrixOperations", "plotHeatmap", "plotProfile", "plotCorrelation", "plotPCA", "plotCoverage", "plotFingerprint", "plotEnrichment", "bamPEFragmentSize", "computeGCBias", "correctGCBias", "alignmentSieve", "estimateReadFiltering", "estimateScaleFactor", "python", "python3", "bash", "sh"]
test = ["test \"$(python -c 'import importlib.metadata as md; print(md.version(\"deepTools\"))')\" = '3.5.6' && test \"$(python -c 'import importlib.metadata as md; print(md.version(\"deeptoolsintervals\"))')\" = '0.1.9' && deeptools --version | grep -Fx 'deeptools 3.5.6' >/dev/null && python -c 'import deeptools, deeptoolsintervals, matplotlib, numpy, plotly, py2bit, pyBigWig, pysam, scipy'", "deeptools --help 2>&1 | grep -F 'Tools for BAM and bigWig file processing' >/dev/null && deeptools --help 2>&1 | grep -F 'plotHeatmap' >/dev/null && for cmd in alignmentSieve bamCompare bamCoverage bamPEFragmentSize bigwigAverage bigwigCompare computeGCBias computeMatrix computeMatrixOperations correctGCBias estimateReadFiltering estimateScaleFactor multiBamSummary multiBigwigSummary plotCorrelation plotCoverage plotEnrichment plotFingerprint plotHeatmap plotPCA plotProfile; do \"$cmd\" --help 2>&1 | grep -E 'usage:|Usage:' >/dev/null; done", "tmp=/tmp/taf-deeptools-bam-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; cd \"$tmp\"; data=/opt/deeptools/share/testdata; bamCoverage -b \"$data/sample1.bam\" -o sample1.bw --binSize 10 --numberOfProcessors 1 && test -s sample1.bw && multiBamSummary bins --bamfiles \"$data/sample1.bam\" \"$data/sample2.bam\" -out bam_summary.npz --binSize 100 --numberOfProcessors 1 && test -s bam_summary.npz && plotCorrelation -in bam_summary.npz --corMethod pearson --whatToPlot heatmap -o correlation.png && test -s correlation.png && alignmentSieve -b \"$data/sample1.bam\" -o filtered.bam --minMappingQuality 10 --numberOfProcessors 1 && test -s filtered.bam && estimateReadFiltering -b \"$data/sample1.bam\" --minMappingQuality 10 > filtering.tsv && test -s filtering.tsv && cd / && rm -rf \"$tmp\"", "tmp=/tmp/taf-deeptools-bigwig-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; cd \"$tmp\"; data=/opt/deeptools/share/testdata; bamCoverage -b \"$data/sample1.bam\" -o sample1.bw --binSize 10 --numberOfProcessors 1 && bamCoverage -b \"$data/sample2.bam\" -o sample2.bw --binSize 10 --numberOfProcessors 1 && test -s sample1.bw && test -s sample2.bw && multiBigwigSummary bins -b sample1.bw sample2.bw -out bigwig_summary.npz --binSize 100 --numberOfProcessors 1 && test -s bigwig_summary.npz && computeMatrix scale-regions -S sample1.bw sample2.bw -R \"$data/regions.bed\" -o matrix.gz --regionBodyLength 100 --beforeRegionStartLength 0 --afterRegionStartLength 0 --numberOfProcessors 1 && test -s matrix.gz && plotHeatmap -m matrix.gz -out heatmap.png && plotProfile -m matrix.gz -out profile.png && test -s heatmap.png && test -s profile.png && bigwigAverage -b sample1.bw sample2.bw -o average.bw && bigwigCompare -b1 sample1.bw -b2 sample2.bw -o compare.bw && test -s average.bw && test -s compare.bw && cd / && rm -rf \"$tmp\""]
